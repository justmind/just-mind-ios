name: JustMind
options:
  bundleIdPrefix: org.justmind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  JustMind:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JustMind
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.justmind.companion
        PRODUCT_NAME: Just Mind
        PRODUCT_MODULE_NAME: JustMind
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: JustMind/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        UILaunchScreen_Generation: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - JustMindTests
  JustMindTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JustMindTests
    dependencies:
      - target: JustMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.justmind.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

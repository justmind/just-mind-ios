<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --maroon:#8a3b2e; --ink:#1f2733; --muted:#6b7785; --line:#e2e7ec;
            --head:#f6f8fa; --bg:#ffffff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           color: var(--ink); display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 16px;
              border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    .tabs { display: flex; gap: 6px; }
    .tab { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
           color: var(--muted); border: 1px solid transparent; }
    .tab.active { background: var(--maroon); color: #fff; }
    .tab:not(.active):hover { background: #f0eceb; color: var(--ink); }
    .search { margin-left: auto; }
    .search input { padding: 8px 11px; font-size: 13px; border: 1px solid var(--line);
                    border-radius: 8px; width: 240px; }
    .count { color: var(--muted); font-size: 12px; }
    .wrap { flex: 1 1 auto; overflow: auto; position: relative; }
    table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
    thead th { position: sticky; top: 0; z-index: 3; background: var(--head); text-align: left;
               font-weight: 600; color: #46505d; padding: 9px 12px; border-bottom: 1px solid var(--line);
               border-right: 1px solid var(--line); white-space: nowrap; }
    td { padding: 7px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
         vertical-align: top; max-width: 320px; }
    /* sticky first column (Name) */
    thead th:first-child { position: sticky; left: 0; z-index: 4; }
    tbody td:first-child { position: sticky; left: 0; z-index: 2; background: var(--bg);
                           font-weight: 700; color: var(--maroon); box-shadow: 1px 0 0 var(--line); }
    tbody tr:nth-child(even) td { background: #fbfcfd; }
    tbody tr:nth-child(even) td:first-child { background: #f5f7f9; }
    tbody tr:hover td { background: #eef5ff; }
    tbody tr:hover td:first-child { background: #e7eefc; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { border-radius: 12px; padding: 2px 9px; font-size: 11.5px; line-height: 1.5; white-space: nowrap; }
    .check { font-size: 14px; }
    .num { font-weight: 700; color: #0b6b43; }
    .muted { color: var(--muted); }
    #loading { padding: 30px; color: var(--muted); }
    .txt { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="tabs">
      <div class="tab active" data-which="therapist" onclick="select('therapist', this)">Therapist Directory</div>
      <div class="tab" data-which="client" onclick="select('client', this)">Client Request Submissions</div>
    </div>
    <span class="count" id="count"></span>
    <div class="search"><input id="search" type="text" placeholder="Filter rows…" oninput="render()"></div>
  </div>
  <div class="wrap"><div id="loading">Loading…</div><div id="grid"></div></div>

<script>
  var PALETTE = [
    ['#d3f0e0','#0b6b43'], ['#cfe8fb','#0b5394'], ['#e6dcf7','#5b3a9b'], ['#fde2cf','#9c4221'],
    ['#fcd9e0','#9b2247'], ['#d3eef1','#0d6b73'], ['#fdf0c9','#7a5f10'], ['#e3e7eb','#3c4654'],
    ['#dcebd3','#3f6b2b'], ['#f1d9c6','#8a4b2b'], ['#cfe3f7','#2b5b8a'], ['#ecd7ef','#7a3b86']
  ];
  var CACHE = {};
  var current = 'therapist';

  // Live data comes from the Apps Script backend; this DEMO only renders in a plain
  // browser preview (no google.script) so the styling is visible.
  var DEMO = {
    therapist: { columns:['Name','Accepting Clients?','Seniority Level','Age Groups','Specialities','Insurance Accepted?','Total Assigned Clients'],
      types:['text','single','single','multi','multi','single','number'],
      rows:[['Helen','Yes','Senior',['Adults (18 - 64)','Older Adults (65+)'],['Anxiety','Depression','Grief & Loss','CBT'],'No',3],
            ['Gabi','Yes','Mid.level',['Teens (13-18)','Adults (18 - 64)'],['Autism','ADHD','OCD'],'Yes',1]] },
    client: { columns:['Name','Submission Date','New Client','Therapy Type','Age Category','Specialities','Using Insurance','Matched Therapists'],
      types:['text','date','single','multi','single','multi','single','multi'],
      rows:[['CC DEMO','2026-06-16 19:49','Yes',['Individuals'],'Adults (18 - 64)',['Adjustment/Life Transitions','Career/Leadership'],'No',['Kyoko (22)','Kari (20)','Alan (16)']],
            ['D.C.','2026-05-28 19:01','No',['Individuals'],'Adults (18 - 64)',['Autism','OCD'],'No',['Brett (16)','Alisar (15)','Bill (15)']]] }
  };
  function fetchData(which, onOk, onErr) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr).getSheetData(which);
    } else { onOk(DEMO[which]); }
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  function colorFor(text) {
    var v = String(text).trim().toLowerCase();
    if (v === 'yes') return PALETTE[0];
    if (v === 'no') return PALETTE[4];
    if (v === 'n/a' || v === 'none') return PALETTE[7];
    var h = 0; for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function chip(text) {
    var c = colorFor(text);
    return '<span class="chip" style="background:' + c[0] + ';color:' + c[1] + '">' + esc(text) + '</span>';
  }
  function cell(value, type) {
    if (value == null || value === '') return '';
    if (type === 'multi') {
      var arr = Array.isArray(value) ? value : [value];
      if (!arr.length) return '';
      return '<div class="chips">' + arr.map(chip).join('') + '</div>';
    }
    if (type === 'single') return chip(value);
    if (type === 'checkbox') return value ? '<span class="check">☑️</span>' : '<span class="muted">—</span>';
    if (type === 'number') return '<span class="num">' + esc(value) + '</span>';
    if (type === 'date') return '<span class="muted">' + esc(value) + '</span>';
    return '<span class="txt">' + esc(value) + '</span>';
  }

  function select(which, el) {
    current = which;
    [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('search').value = '';
    if (CACHE[which]) { render(); }
    else {
      document.getElementById('grid').innerHTML = '';
      document.getElementById('loading').style.display = 'block';
      fetchData(which, function (data) { CACHE[which] = data; render(); },
        function (e) { document.getElementById('loading').textContent = 'Error: ' + (e && e.message ? e.message : e); });
    }
  }

  function render() {
    var data = CACHE[current];
    if (!data) return;
    document.getElementById('loading').style.display = 'none';
    var q = document.getElementById('search').value.trim().toLowerCase();
    var rows = data.rows.filter(function (r) {
      if (!q) return true;
      return r.some(function (v) { return String(Array.isArray(v) ? v.join(' ') : v).toLowerCase().indexOf(q) !== -1; });
    });
    var html = '<table><thead><tr>';
    data.columns.forEach(function (c) { html += '<th>' + esc(c) + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>';
      for (var c = 0; c < data.columns.length; c++) html += '<td>' + cell(r[c], data.types[c]) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('grid').innerHTML = html;
    document.getElementById('count').textContent = rows.length + ' of ' + data.rows.length + ' records';
  }

  // initial load
  fetchData('therapist', function (data) { CACHE['therapist'] = data; render(); },
    function (e) { document.getElementById('loading').textContent = 'Error: ' + (e && e.message ? e.message : e); });
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root { --maroon:#8a3b2e; --ink:#1f2733; --muted:#6b7785; --line:#d8dee6;
            --green:#2d6a4f; --bg:#ffffff; --chip:#eef3f8; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           color: var(--ink); margin: 0; padding: 24px 28px 40px; background: var(--bg); }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    hr { border: none; border-top: 1px solid var(--line); margin: 16px 0 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 34px; }
    .field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    .req { color: #d23b2e; }
    input[type=text], select, input[type=datetime-local] {
      width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--line);
      border-radius: 7px; background: #fff; color: var(--ink); }
    input:focus, select:focus, .ms:focus-within { outline: none; border-color: var(--maroon);
      box-shadow: 0 0 0 2px rgba(138,59,46,.15); }
    .ms { border: 1px solid var(--line); border-radius: 7px; padding: 6px; background:#fff; }
    .ms .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .ms .chips:empty { display: none; }
    .chip { background: var(--chip); border-radius: 14px; padding: 3px 9px; font-size: 12px;
            display: inline-flex; align-items: center; gap: 6px; }
    .chip b { font-weight: 500; }
    .chip span { cursor: pointer; color: var(--muted); font-weight: 700; }
    .ms input.search { width: 100%; border: none; padding: 5px 4px; font-size: 13px; }
    .ms input.search:focus { outline: none; }
    .ms .list { max-height: 168px; overflow-y: auto; border-top: 1px solid var(--line);
                margin-top: 4px; display: none; }
    .ms.open .list { display: block; }
    .ms .opt { padding: 6px 8px; font-size: 13px; cursor: pointer; border-radius: 5px;
               display: flex; align-items: center; gap: 8px; }
    .ms .opt:hover { background: var(--chip); }
    .ms .opt.sel { color: var(--green); font-weight: 600; }
    .ms .opt .box { width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 3px;
                    display: inline-block; flex: 0 0 auto; }
    .ms .opt.sel .box { background: var(--green); border-color: var(--green); }
    .actions { margin-top: 26px; display: flex; gap: 12px; align-items: center; }
    button { font-size: 14px; padding: 10px 20px; border-radius: 8px; border: 1px solid transparent;
             cursor: pointer; font-weight: 600; }
    button.primary { background: var(--maroon); color: #fff; }
    button.primary:disabled { opacity: .5; cursor: default; }
    button.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
    .err { color: #d23b2e; font-size: 13px; margin-top: 12px; min-height: 16px; }
    /* results */
    #results { display: none; }
    .result-head { font-size: 15px; margin: 0 0 14px; }
    .result-head b { color: var(--green); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .rank { color: var(--muted); width: 28px; }
    .score { font-weight: 700; color: var(--green); width: 56px; }
    .reasons { color: var(--muted); }
    button.assign { padding: 5px 12px; font-size: 12px; border: 1px solid var(--maroon);
                    color: var(--maroon); background: #fff; border-radius: 6px; }
    button.assign:hover { background: var(--maroon); color: #fff; }
    button.assign.done { border-color: var(--green); color: #fff; background: var(--green); }
    button.assign:disabled { opacity: .7; cursor: default; }
    #loading { color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <h1>New Client Form</h1>
  <p class="sub">Adds a record to <b>Client Request Submissions</b> and returns ranked therapist matches.</p>
  <hr>

  <div id="loading">Loading options…</div>

  <form id="form" style="display:none">
    <div class="grid" id="grid"></div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="submit" class="primary" id="submitBtn">Submit &amp; match</button>
      <button type="button" class="ghost" onclick="safeClose()">Close</button>
    </div>
  </form>

  <div id="results">
    <p class="result-head" id="resultHead"></p>
    <table><thead><tr><th class="rank">#</th><th>Therapist</th><th class="score">Score</th><th>Why</th><th></th></tr></thead>
      <tbody id="resultBody"></tbody></table>
    <div class="actions">
      <button type="button" class="primary" onclick="resetForm()">Add another</button>
      <button type="button" class="ghost" onclick="safeClose()">Done</button>
    </div>
  </div>

<script>
  // Field layout — order mirrors the Airtable form (left/right by row).
  var FIELDS = [
    { key:'name',            label:'Name',                  type:'text',   required:true },
    { key:'newClient',       label:'New Client',            type:'single', opt:'New Client' },
    { key:'therapyType',     label:'Therapy Type',          type:'multi',  opt:'Therapy Type' },
    { key:'ageCategory',     label:'Age Category',          type:'single', opt:'Age Category', required:true },
    { key:'specialities',    label:'Specialities',          type:'multi',  opt:'Specialities', required:true },
    { key:'subSpecialties',  label:'Sub-Specialties',       type:'multi',  opt:'Sub-Specialties' },
    { key:'availability',    label:'Availability',          type:'multi',  opt:'Availability' },
    { key:'virtual',         label:'Virtual vs. In Person', type:'multi',  opt:'Virtual vs. In Person' },
    { key:'usingInsurance',  label:'Using Insurance',       type:'single', opt:'Using Insurance' },
    { key:'insuranceCarrier',label:'Insurance Carrier',     type:'single', opt:'Insurance Carrier' },
    { key:'officeLocation',  label:'Office Location',        type:'single', opt:'Office Location' },
    { key:'submissionDate',  label:'Submission Date',        type:'datetime' }
  ];
  var OPTIONS = {};
  var STATE = {};   // key -> selected value(s)
  var LAST_ROW = null;   // row of the just-saved submission (for Assign)

  google.script.run.withSuccessHandler(init).withFailureHandler(fatal).getClientFormOptions();

  function init(options) {
    OPTIONS = options || {};
    document.getElementById('loading').style.display = 'none';
    document.getElementById('form').style.display = 'block';
    var grid = document.getElementById('grid');
    FIELDS.forEach(function (f) { grid.appendChild(buildField(f)); });
    document.getElementById('form').addEventListener('submit', onSubmit);
  }
  function fatal(e) {
    document.getElementById('loading').textContent = 'Error: ' + (e && e.message ? e.message : e);
  }

  function buildField(f) {
    var wrap = document.createElement('div'); wrap.className = 'field';
    var lab = document.createElement('label');
    lab.innerHTML = f.label + (f.required ? ' <span class="req">*</span>' : '');
    wrap.appendChild(lab);

    if (f.type === 'text') {
      var inp = document.createElement('input'); inp.type = 'text'; inp.id = 'f_' + f.key;
      inp.oninput = function () { STATE[f.key] = inp.value; };
      wrap.appendChild(inp);
    } else if (f.type === 'datetime') {
      var dt = document.createElement('input'); dt.type = 'datetime-local'; dt.id = 'f_' + f.key;
      dt.value = nowLocal();
      STATE[f.key] = dt.value;
      dt.onchange = function () { STATE[f.key] = dt.value; };
      wrap.appendChild(dt);
    } else if (f.type === 'single') {
      var sel = document.createElement('select'); sel.id = 'f_' + f.key;
      sel.appendChild(new Option('', ''));
      (OPTIONS[f.opt] || []).forEach(function (o) { sel.appendChild(new Option(o, o)); });
      sel.onchange = function () { STATE[f.key] = sel.value; };
      wrap.appendChild(sel);
    } else { // multi
      STATE[f.key] = [];
      wrap.appendChild(buildMulti(f));
    }
    return wrap;
  }

  function buildMulti(f) {
    var opts = OPTIONS[f.opt] || [];
    var box = document.createElement('div'); box.className = 'ms';
    var chips = document.createElement('div'); chips.className = 'chips';
    var search = document.createElement('input'); search.className = 'search';
    search.placeholder = '+ Add ' + f.label.toLowerCase();
    var list = document.createElement('div'); list.className = 'list';
    box.appendChild(chips); box.appendChild(search); box.appendChild(list);

    function render() {
      // chips
      chips.innerHTML = '';
      STATE[f.key].forEach(function (v) {
        var c = document.createElement('div'); c.className = 'chip';
        c.innerHTML = '<b></b><span>&times;</span>';
        c.querySelector('b').textContent = v;
        c.querySelector('span').onclick = function () {
          STATE[f.key] = STATE[f.key].filter(function (x) { return x !== v; }); render();
        };
        chips.appendChild(c);
      });
      // list (filtered)
      var q = search.value.trim().toLowerCase();
      list.innerHTML = '';
      opts.filter(function (o) { return !q || o.toLowerCase().indexOf(q) !== -1; })
          .forEach(function (o) {
        var sel = STATE[f.key].indexOf(o) !== -1;
        var row = document.createElement('div'); row.className = 'opt' + (sel ? ' sel' : '');
        row.innerHTML = '<span class="box"></span>';
        row.appendChild(document.createTextNode(o));
        row.onmousedown = function (ev) {
          ev.preventDefault();
          if (sel) STATE[f.key] = STATE[f.key].filter(function (x) { return x !== o; });
          else STATE[f.key] = STATE[f.key].concat([o]);
          render();
        };
        list.appendChild(row);
      });
    }
    search.onfocus = function () { box.classList.add('open'); render(); };
    search.oninput = render;
    document.addEventListener('mousedown', function (ev) {
      if (!box.contains(ev.target)) box.classList.remove('open');
    });
    render();
    return box;
  }

  function onSubmit(ev) {
    ev.preventDefault();
    document.getElementById('err').textContent = '';
    var missing = FIELDS.filter(function (f) {
      if (!f.required) return false;
      var v = STATE[f.key];
      return f.type === 'multi' ? !(v && v.length) : !(v && String(v).trim());
    }).map(function (f) { return f.label; });
    if (missing.length) {
      document.getElementById('err').textContent = 'Please fill required field(s): ' + missing.join(', ');
      return;
    }
    var payload = {
      name: STATE.name, newClient: STATE.newClient, therapyType: STATE.therapyType,
      ageCategory: STATE.ageCategory, specialities: STATE.specialities,
      subSpecialties: STATE.subSpecialties, availability: STATE.availability,
      virtual: STATE.virtual, usingInsurance: STATE.usingInsurance,
      insuranceCarrier: STATE.insuranceCarrier, officeLocation: STATE.officeLocation,
      submissionDate: STATE.submissionDate ? new Date(STATE.submissionDate).toISOString() : ''
    };
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Matching…';
    google.script.run.withSuccessHandler(showResults).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Submit & match';
      document.getElementById('err').textContent = 'Error: ' + (e && e.message ? e.message : e);
    }).submitClientForm(payload);
  }

  function showResults(res) {
    LAST_ROW = res.rowNumber;
    document.getElementById('form').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    var head = document.getElementById('resultHead');
    head.innerHTML = 'Saved as row ' + res.rowNumber + '. <b>' + res.eligibleCount +
      '</b> eligible therapist' + (res.eligibleCount === 1 ? '' : 's') +
      (res.matches.length ? ' — top ' + res.matches.length + ' (click <b>Assign</b> to set the therapist):' : '.');
    var body = document.getElementById('resultBody'); body.innerHTML = '';
    res.matches.forEach(function (m, i) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td class="rank">' + (i + 1) + '</td><td></td><td class="score">' + m.score +
        '</td><td class="reasons"></td><td></td>';
      tr.children[1].textContent = m.name;
      tr.children[3].textContent = m.reasons.join(', ');
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'assign'; btn.textContent = 'Assign';
      btn.onclick = function () { assign(m.name, btn, body); };
      tr.children[4].appendChild(btn);
      body.appendChild(tr);
    });
  }

  function assign(name, btn, body) {
    btn.disabled = true; btn.textContent = '…';
    google.script.run.withSuccessHandler(function () {
      // mark this one assigned, reset the others
      Array.prototype.forEach.call(body.querySelectorAll('button.assign'), function (b) {
        if (b === btn) { b.textContent = 'Assigned ✓'; b.className = 'assign done'; b.disabled = true; }
        else { b.disabled = false; b.textContent = 'Assign'; b.className = 'assign'; }
      });
    }).withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Assign';
      document.getElementById('resultHead').insertAdjacentHTML('afterend',
        '<p class="err">Assign failed: ' + (e && e.message ? e.message : e) + '</p>');
    }).assignTherapist(LAST_ROW, name);
  }

  function safeClose() { try { google.script.host.close(); } catch (e) { resetForm(); } }

  function resetForm() {
    FIELDS.forEach(function (f) {
      if (f.type === 'multi') STATE[f.key] = [];
      else if (f.type === 'datetime') STATE[f.key] = nowLocal();
      else STATE[f.key] = '';
    });
    document.getElementById('results').style.display = 'none';
    document.getElementById('grid').innerHTML = '';
    FIELDS.forEach(function (f) { document.getElementById('grid').appendChild(buildField(f)); });
    var btn = document.getElementById('submitBtn'); btn.disabled = false; btn.textContent = 'Submit & match';
    document.getElementById('err').textContent = '';
    document.getElementById('form').style.display = 'block';
  }

  function nowLocal() {
    var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
</script>
</body>
</html>
